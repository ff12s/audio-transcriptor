[project]
name = "meeting-notes"
version = "0.1.0"
description = "Локальная транскрипция записей встреч в Markdown через GigaAM (onnx-asr) или faster-whisper"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper",
    # faster-whisper 1.2.1 passes metadata_errors to av.open, removed in PyAV 19;
    # drop the pin once a faster-whisper release includes the fix.
    "av<19",
    "typer",
    "rich",
    "pydantic>=2",
    "pydantic-settings",
    "nvidia-cublas-cu12 ; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9,<10 ; sys_platform == 'win32'",
    "proc-tap ; sys_platform == 'win32'",
    "soundcard ; sys_platform == 'win32'",
    "psutil ; sys_platform == 'win32'",
    "scipy",
    "onnx-asr[hub]",
    "onnxruntime-gpu[cuda,cudnn] ; sys_platform == 'win32'",
]

# faster-whisper requires the CPU `onnxruntime` package, which installs the same `onnxruntime`
# module as onnxruntime-gpu; the override keeps it off Windows. A uv override replaces the
# requirement entirely, so faster-whisper's own bound (>=1.14,<2) is repeated here.
[tool.uv]
override-dependencies = ["onnxruntime>=1.14,<2 ; sys_platform != 'win32'"]

[project.scripts]
transcribe = "meeting_notes.cli:app"
record = "meeting_notes.cli:record_app"

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "types-psutil"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_notes"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "ctranslate2.*", "nvidia.*", "soundcard.*", "proctap.*", "scipy.*", "onnx_asr.*", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
